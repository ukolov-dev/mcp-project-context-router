name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.13.0
            fts5: false
          - node: 22.23.2
            fts5: true
    env:
      PROJECT_CONTEXT_EXPECT_FTS5: ${{ matrix.fts5 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm run package:check

      - name: Check clean consumer installation
        run: npm run package:consumer

      - name: Diagnose project context
        run: node bin/project-context doctor --json

      - name: Save verified candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-package-${{ github.event.pull_request.head.sha || github.sha }}-node-${{ matrix.node }}
          path: |
            artifacts/consumer-install/*.tgz
            artifacts/consumer-install/report.json
            artifacts/consumer-install/dependencies.json
          if-no-files-found: error
          retention-days: 14
